name: Autonomous Codebase Audit & Security Scan

on:
  schedule:
    - cron: '0 4 * * 1' # Runs every Monday at 04:00 UTC
  workflow_dispatch:
    inputs:
      subsystems:
        description: 'Code subsystems to audit (all, scsi_usb, partition_fat32, flasher_engine, dsa_storage_io, platform_security)'
        required: false
        default: 'all'
      create_issue:
        description: 'Create or update GitHub Issue with audit findings'
        type: boolean
        required: false
        default: true
      fail_on_critical:
        description: 'Fail the workflow if P0 critical issues are detected'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autonomous-audit:
    name: Codebase Audit & Static Intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/scripts/requirements.txt

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt

      - name: Run Autonomous Auditor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.create_issue }}" != "false" ]; then
            FLAGS="$FLAGS --create-issue"
          fi
          if [ "${{ github.event.inputs.fail_on_critical }}" = "true" ]; then
            FLAGS="$FLAGS --fail-on-critical"
          fi

          SUBSYSTEM="${{ github.event.inputs.subsystems || 'all' }}"

          python3 .github/scripts/repo_auditor.py \
            --subsystems "$SUBSYSTEM" \
            --output audit_report.md \
            $FLAGS

      - name: Upload Audit Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-audit-report
          path: audit_report.md
          retention-days: 30
